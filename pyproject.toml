[project]
name = "library-of-mess"
version = "0.2.0"
description = "Browse and tag your video library: Streamlit UI over a parquet metadata database."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Unlicense" }
authors = [{ name = "Jacek Kreft" }]
dependencies = [
    "streamlit>=1.38,<2",
    "pandas>=2.2",
    "pyarrow>=17",
    "mutagen>=1.47",
    "ffmpeg-python>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pandas-stubs>=2.2",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library_of_mess"]

[tool.uv]
package = true
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["library_of_mess"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "mutagen.*", "ffmpeg.*"]
ignore_missing_imports = true
